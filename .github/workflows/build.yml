name: Build chopin KernelSU kernel

on:
  push:
    branches:
      - chopin-ksu-kernel
      - 'ci/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = 完整 Image.gz；check = 只编译 kernelsu 驱动（快速验证）'
        required: false
        default: 'full'
      make_target:
        description: '覆盖构建目标（留空用 mode 决定）'
        required: false
        default: ''
      kernel_repo:
        description: '内核源码仓库（留空用默认小米官方 OSS）'
        required: false
        default: ''
      kernel_branch:
        description: '内核源码分支（留空用 chopin-r-oss）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    env:
      ARCH: arm64
      TARGET_VERMAGIC: '4.14.186-gaa24d707761c SMP preempt mod_unload modversions aarch64'
      KREPO: 'https://github.com/ChopinKernels/kernel_xiaomi_chopin_android_S.git'
      KBRANCH: 'S'

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 基础依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev rsync zip unzip cpio python3

      - name: 拉取 chopin 内核源码（小米官方 OSS / 4.14.186）
        run: |
          REPO="${{ github.event.inputs.kernel_repo }}"; [ -n "$REPO" ] || REPO="$KREPO"
          BR="${{ github.event.inputs.kernel_branch }}"; [ -n "$BR" ] || BR="$KBRANCH"
          echo "源码: $REPO @ $BR"
          git clone --depth 1 --single-branch --branch "$BR" "$REPO" kernel
          cd kernel
          git log -1 --format='HEAD %H %s'
          make kernelversion
          # 去掉 .git：避免 setlocalversion 给 vermagic 追加 -dirty / +
          rm -rf .git

      - name: 准备工具链（apt clang-12，对齐原厂 clang-r383902）
        run: |
          set -e
          sudo apt-get install -y -qq clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          TC="$GITHUB_WORKSPACE/tc/bin"
          mkdir -p "$TC"
          for t in clang clang++ ld.lld lld llvm-ar llvm-nm llvm-objcopy llvm-strip llvm-objdump; do
            if [ -e "/usr/bin/$t-12" ]; then src="/usr/bin/$t-12"; else src="/usr/bin/$t"; fi
            ln -sf "$src" "$TC/$(basename "$t")"
          done
          echo "TCBIN=$TC" >> "$GITHUB_ENV"
          export PATH="$TC:$PATH"
          clang --version | head -2
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-elfedit --version | head -1
          which ld.lld llvm-ar llvm-objcopy

      - name: 解包 payload 并集成 KernelSU v0.9.5
        run: |
          set -e
          tar xzf payload.tar.gz
          tar xzf ksu095.tar.gz -C kernel/drivers
          printf '\nobj-$(CONFIG_KSU)\t\t+= kernelsu/\n' >> kernel/drivers/Makefile
          sed -i 's/^endmenu$/source "drivers\/kernelsu\/Kconfig"\n\nendmenu/' kernel/drivers/Kconfig
          cp kernel_config kernel/.config
          echo "--- drivers/Makefile tail ---"
          tail -3 kernel/drivers/Makefile
          echo "--- drivers/Kconfig tail ---"
          tail -5 kernel/drivers/Kconfig
          echo "--- kernelsu tree ---"
          ls kernel/drivers/kernelsu | head -30

      - name: 放宽编译器能力检查（老树 cc-option 探测在本工具链下会误报）
        run: |
          set -e
          f=kernel/Makefile
          # prepare-compiler-check 里若干能力探测用 -Werror 试编译，clang-12 + 老树 flags
          # 会误判成"编译器不支持 -fstack-protector-strong"。把致命退出改成警告，
          # 真正的编译失败会在后续 make 里照常暴露。
          sed -i 's/>&2 && exit 1/>\&2 || true/' "$f"
          echo "--- 剩余 exit 1 检查 ---"
          grep -n 'exit 1' "$f" || echo "(已全部放宽)"

      - name: 跳过 modversions 逐符号 CRC 校验（vendor 模块 CRC 与公开源码树对不齐）
        run: |
          set -e
          python3 - <<'PY'
          import re
          p = "kernel/kernel/module.c"
          src = open(p, encoding="utf-8", errors="replace").read()
          if "MIRAI_SKIP_CRC_CHECK" in src:
              print("已打过补丁")
          else:
              m = re.search(r"static\s+int\s+check_version\s*\([^)]*\)\s*\n?\s*\{", src)
              if not m:
                  raise SystemExit("未找到 check_version 定义")
              patch = ("\n\t/* MIRAI_SKIP_CRC_CHECK: 跳过 __versions 逐符号 CRC 比对，"
                       "vermagic 仍在 check_modinfo 里校验 */\n\treturn 1;\n")
              src = src[:m.end()] + patch + src[m.end():]
              open(p, "w", encoding="utf-8", newline="\n").write(src)
              print("已在 check_version 插入短路 return 1")
          PY
          grep -n 'MIRAI_SKIP_CRC_CHECK' kernel/kernel/module.c

      - name: 修补内核树已知笔误（mrdump-objs 取了未定义的 -n 变量）
        run: |
          set -e
          f=kernel/drivers/misc/mediatek/aee/mrdump/Makefile
          if grep -q 'mrdump-objs := $(mrdump-objs-n)' "$f"; then
            sed -i 's/mrdump-objs := \$(mrdump-objs-n)/mrdump-objs := $(mrdump-objs-y)/' "$f"
            echo "已修正：$(grep -n 'mrdump-objs' "$f" | tail -1)"
          fi

      - name: 配置（锁 vermagic，保证 vendor 模块可加载）
        run: |
          set -e
          cd kernel
          sed -i 's/^CONFIG_LOCALVERSION_AUTO=y$/# CONFIG_LOCALVERSION_AUTO is not set/' .config
          sed -i 's/^CONFIG_LOCALVERSION=.*$/CONFIG_LOCALVERSION="-gaa24d707761c"/' .config
          grep -q '^CONFIG_LOCALVERSION="-gaa24d707761c"$' .config || echo 'CONFIG_LOCALVERSION="-gaa24d707761c"' >> .config
          grep -q '^CONFIG_LOCALVERSION_AUTO=' .config && sed -i 's/^CONFIG_LOCALVERSION_AUTO=.*$/# CONFIG_LOCALVERSION_AUTO is not set/' .config || true
          mkdir -p out
          mv .config out/.config
          export PATH="$TCBIN:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               KCFLAGS=-Wno-error olddefconfig
          echo "=== 关键配置 ==="
          grep -E '^CONFIG_(KSU|KPROBES|OVERLAY_FS|MODULES|MODVERSIONS|KALLSYMS|PREEMPT|SMP|LOCALVERSION)' out/.config
          echo "=== 校验 ==="
          grep -q '^CONFIG_KSU=y' out/.config || { echo "!! CONFIG_KSU 未启用"; exit 1; }
          grep -q '^CONFIG_OVERLAY_FS=y' out/.config || { echo "!! CONFIG_OVERLAY_FS 未启用"; exit 1; }
          grep -q '^CONFIG_KPROBES=y' out/.config || { echo "!! CONFIG_KPROBES 未启用"; exit 1; }
          grep -q '^CONFIG_LOCALVERSION="-gaa24d707761c"' out/.config || { echo "!! LOCALVERSION 未锁定"; exit 1; }
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' out/.config || { echo "!! LOCALVERSION_AUTO 未关闭"; exit 1; }

      - name: 诊断补丁：模块加载失败时打印真实原因
        run: |
          set -e
          python3 - <<'PY'
          import re
          p = "kernel/kernel/module.c"
          src = open(p, encoding="utf-8", errors="replace").read()
          if "MIRAI_DIAG" in src:
              print("已打过诊断补丁")
          else:
              # 1) try_to_force_load 打印原因（原本在 FORCE_LOAD 关闭时静默返回 -ENOEXEC）
              m = re.search(r"static int try_to_force_load\s*\([^)]*\)\s*\n?\s*\{", src)
              if m:
                  ins = '\n\tpr_err("MIRAI_DIAG: try_to_force_load(%s): %s\\n", mod->name, reason);\n'
                  src = src[:m.end()] + ins + src[m.end():]
                  print("已插入 try_to_force_load 诊断")
              else:
                  print("!! 未找到 try_to_force_load")
              # 2) check_modinfo 进入时打印 modmagic 与内核 vermagic
              m2 = re.search(r"static int check_modinfo\s*\([^)]*\)\s*\n?\s*\{", src)
              if m2:
                  ins2 = ('\n\t{ const char *dbg = get_modinfo(info, "vermagic");\n'
                          '\t  pr_err("MIRAI_DIAG: check_modinfo %s modmagic=[%s] vermagic=[%s]\\n",\n'
                          '\t\t info->name ? info->name : "?", dbg ? dbg : "(null)", vermagic); }\n')
                  src = src[:m2.end()] + ins2 + src[m2.end():]
                  print("已插入 check_modinfo 诊断")
              else:
                  print("!! 未找到 check_modinfo")
              open(p, "w", encoding="utf-8", newline="\n").write(src)
          PY
          grep -n 'MIRAI_DIAG' kernel/kernel/module.c

      - name: 生成构建头（prepare）
        run: |
          set -e
          cd kernel
          export PATH="$TCBIN:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- prepare modules_prepare -j$(nproc)

      - name: 生成 selinux 生成头（flask.h / av_permissions.h）
        run: |
          set -e
          cd kernel
          export PATH="$TCBIN:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- security/selinux/ -j$(nproc)
          ls -l out/security/selinux/flask.h out/security/selinux/av_permissions.h

      - name: 快速验证：只编译 kernelsu 驱动
        run: |
          set -e
          cd kernel
          export PATH="$TCBIN:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- drivers/kernelsu/ -j$(nproc)
          echo "KSU 驱动对象编译通过"
          find out/drivers/kernelsu -name '*.o' | head -20

      - name: 构建 Image.gz
        if: ${{ github.event.inputs.mode != 'check' }}
        run: |
          cd kernel
          export PATH="$TCBIN:$PATH"
          TARGET="${{ github.event.inputs.make_target }}"
          [ -n "$TARGET" ] || TARGET="Image.gz"
          echo "构建目标: $TARGET（-k 继续编译，一轮收全部错误）"
          set +e
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- "$TARGET" -k -j$(nproc) 2>&1 | tee ../build.log
          echo "make exit: ${PIPESTATUS[0]}"
          set -e
          ls -l out/arch/arm64/boot/ 2>/dev/null || true

      - name: 汇总构建错误
        if: ${{ github.event.inputs.mode != 'check' }}
        run: |
          cd kernel
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz 已生成：$(ls -l out/arch/arm64/boot/Image.gz)"
          else
            echo "=== 错误汇总 ==="
            grep -nE 'error:|Error [0-9]+|No rule to make target' ../build.log | head -100 || true
            exit 1
          fi

      - name: 自检 vermagic（用本树编一个测试模块，读它的 vermagic）
        if: ${{ github.event.inputs.mode != 'check' }}
        run: |
          cd kernel
          export PATH="$TCBIN:$PATH"
          TM="$GITHUB_WORKSPACE/testmod"
          mkdir -p "$TM"
          cat > "$TM/Makefile" <<'EOF'
          obj-m := testmod.o
          EOF
          cat > "$TM/testmod.c" <<'EOF'
          #include <linux/module.h>
          #include <linux/kernel.h>
          static int __init tm_init(void) { return 0; }
          static void __exit tm_exit(void) { }
          module_init(tm_init);
          module_exit(tm_exit);
          MODULE_LICENSE("GPL");
          EOF
          echo "===== 用本树编测试模块 ====="
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- M="$TM" modules -j$(nproc) 2>&1 | tail -15 || true
          echo
          echo "===== 测试模块的 vermagic（本树生成值）====="
          modinfo -F vermagic "$TM/testmod.ko" 2>/dev/null || true
          strings -a "$TM/testmod.ko" | grep -a 'vermagic=' || true
          echo
          echo "===== 目标值 ====="
          echo "$TARGET_VERMAGIC"
          echo
          echo "===== 内核镜像里 vermagic 相关串 ====="
          for s in "SMP preempt" "mod_unload" "modversions" "version magic"; do
            echo "  Image  [$s] = $(strings -a out/arch/arm64/boot/Image | grep -c "$s" || true)"
            echo "  vmlinux[$s] = $(strings -a out/vmlinux | grep -c "$s" || true)"
          done
          echo
          echo "===== 测试模块能否被本内核接受（vermagic 比对）====="
          python3 - "$TM/testmod.ko" "$TARGET_VERMAGIC" <<'PY'
          import sys, subprocess
          ko, target = sys.argv[1], sys.argv[2]
          try:
              out = subprocess.run(["modinfo", "-F", "vermagic", ko],
                                   capture_output=True, text=True).stdout.strip()
          except Exception as e:
              out = f"<modinfo failed: {e}>"
          print("  tree vermagic :", repr(out))
          print("  target        :", repr(target))
          print("  match         :", out == target)
          PY

      - name: 诊断 vermagic（vmlinux / Image / autoconf 三处对照）
        if: ${{ github.event.inputs.mode != 'check' }}
        run: |
          cd kernel
          echo "===== autoconf.h ====="
          grep -E 'CONFIG_MODULE_UNLOAD|CONFIG_MODVERSIONS|CONFIG_SMP|CONFIG_PREEMPT' out/include/generated/autoconf.h || echo "(autoconf 里没有)"
          echo
          echo "===== module.o 对象里的关键字符串 ====="
          for s in "version magic" "mod_unload" "modversions" "disagrees about version" "MIRAI_SKIP"; do
            printf '  %-26s %s\n' "$s" "$(strings -a out/kernel/module.o 2>/dev/null | grep -c "$s" || echo 0)"
          done
          echo
          echo "===== vmlinux 里的 vermagic 字符串 ====="
          strings -a out/vmlinux | grep -E '4\.14\.186-gaa24d707761c' | head -5 || echo "(vmlinux 未命中)"
          echo "mod_unload 计数: $(strings -a out/vmlinux | grep -c mod_unload || true)"
          echo "modversions 计数: $(strings -a out/vmlinux | grep -c modversions || true)"
          echo
          echo "===== Image 里的 vermagic 字符串 ====="
          strings -a out/arch/arm64/boot/Image | grep -E '4\.14\.186-gaa24d707761c.*(SMP|preempt)' | head -5 || echo "(Image 未命中带 SMP/preempt 的版本串)"
          echo
          echo "===== System.map 里 kcrctab 区间 ====="
          grep -E '__start___kcrctab|__stop___kcrctab' out/System.map | head -8

      - name: 校验产物（版本串 / vermagic）
        if: ${{ github.event.inputs.mode != 'check' }}
        run: |
          set -e
          IMG=kernel/out/arch/arm64/boot/Image.gz
          test -f "$IMG"
          ls -l "$IMG"
          echo "=== 版本串 ==="
          gunzip -c "$IMG" | strings | grep -m3 'Linux version 4.14.186' || true
          echo "=== 期望 vermagic: $TARGET_VERMAGIC ==="
          gunzip -c "$IMG" | strings | grep -m3 -F "$TARGET_VERMAGIC" || echo "!! 未在 Image 里找到期望 vermagic（可能被压缩/未被 strings 命中）"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chopin-ksu-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/.config
            kernel/out/Module.symvers
            kernel/out/System.map
            build.log
          if-no-files-found: warn
          retention-days: 30